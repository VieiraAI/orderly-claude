<!doctype html>
<html lang="en"><head>
<script>
  // Same setting as the session view; applied before paint so there is no flash.
  try {
    const forced = new URLSearchParams(location.search).get('theme');
    document.documentElement.dataset.theme = forced || localStorage.getItem('cz-theme') || 'light';
  } catch { document.documentElement.dataset.theme = 'light'; }
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run — Orderly Claude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/workflows.css">
</head><body>

<nav class="nav">
  <span class="app-menu" id="appMenu"></span>
  <span class="here">run</span>
  <div class="crumbs" style="margin-left:16px;">
    <span>Runs</span><span>›</span><span class="here" id="crumbTitle">—</span>
  </div>
  <span class="spacer"></span>
  <span class="eyebrow" id="runSession"></span>
  <a class="link link-back" id="toParent" hidden title="The run whose step started this one"></a>
  <a class="link link-back" id="backToWf" href="/workflows.html#workflows" title="Open this workflow in the editor">← Back to workflow</a>
  <a class="link link-back" href="/" title="Back to your Claude Code sessions">Back to Session →</a>
</nav>
<script type="module">
  import { mountAppMenu } from '/app-menu.mjs';
  mountAppMenu(document.getElementById('appMenu'), { here: 'runs', theme: true });
</script>

<div class="app">
  <aside class="panel">
    <div class="head">
      <div class="title-row">
        <span class="pip" id="runCatPip"></span>
        <h2 id="runTitle">—</h2>
      </div>
      <div class="sub" id="runSub"><span id="runStatus">loading…</span></div>
      <div id="runNotice"></div>
      <div id="answerPanel"></div>
      <div id="retroPanel"></div>
    </div>
    <div class="plan-rail" id="rail"></div>
  </aside>
  <div class="canvas-wrap">
    <div class="timeline hidden" id="timeline"></div>
    <div class="canvas" id="canvas">
      <svg class="edges" id="edges"></svg>
    </div>
  </div>
</div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="x" id="drawerClose" title="Close">×</button>
  <div id="drawerBody"></div>
</aside>

<script type="module" src="/workflows-run.mjs"></script>
</body></html>
