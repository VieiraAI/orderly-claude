<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Workflow editor — Orderly Claude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/workflows.css">
<style>
  .ed-layout { display: grid; grid-template-columns: 1fr 320px; gap: 0; height: calc(100vh - 56px); }
  .ed-canvas { position: relative; overflow: auto;
    background:
      radial-gradient(circle, var(--cv-dot) 1px, transparent 1px) 0 0 / 20px 20px,
      var(--bg);
    border-right: 1px solid var(--edge-tint); }
  .ed-side { padding: 20px 20px 40px; overflow: auto; border-left: 1px solid var(--edge-tint); background: var(--surface); }
  .ed-side h3 { margin: 0 0 10px; font: 500 13px var(--f-ui); color: var(--text); letter-spacing: -0.01em; }
  .ed-side .block { margin-bottom: 20px; }
  .ed-side input, .ed-side select, .ed-side textarea {
    width: 100%; padding: 7px 10px; font: 13px var(--f-ui); color: var(--text);
    background: var(--bg); border: 1px solid var(--edge-tint); border-radius: 6px; outline: none;
    margin-bottom: 6px;
  }
  .ed-side textarea { font: 12px/1.5 var(--f-mono); min-height: 120px; resize: vertical; }
  .ed-side input:focus, .ed-side select:focus, .ed-side textarea:focus { border-color: var(--edge-hi); }
  .ed-side label { display: block; font: 10.5px var(--f-mono); color: var(--mute); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }

  .ed-canvas-inner { position: relative; min-width: 1600px; min-height: 900px; }
  .svg-edges { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .svg-edges .edge-hit { pointer-events: stroke; cursor: pointer; }
  .svg-edges .edge-hit:hover + .edge { stroke-width: 2.4; opacity: 1; stroke: var(--ship); }
  .svg-edges .edge-label { pointer-events: auto; }
  .svg-edges .edge-label:hover rect { fill: #1b1b22; }

  /* Per-kind spec form on the sidebar. */
  .spec-form { margin: 10px 0 4px; display: flex; flex-direction: column; gap: 2px; }
  .spec-form label { margin-top: 4px; }
  .opt-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 4px; margin-bottom: 4px; }
  .opt-row .opt-type { grid-column: 2 / 3; }
  .opt-row input, .opt-row select { margin: 0; padding: 5px 8px; font: 11px var(--f-mono); }
  .opt-row button { padding: 4px 8px; font-size: 11px; }

  /* Edges form on the selected node — lists incoming + outgoing edges and
     lets you add new ones with the full catalog of neighbors. */
  .edges-form { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .edges-form h4 { margin: 10px 0 4px; font: 500 11px var(--f-mono); color: var(--mute);
    letter-spacing: 0.08em; text-transform: uppercase; }
  .edge-row { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center;
    padding: 5px 8px; background: var(--bg); border: 1px solid var(--edge-tint); border-radius: 6px;
    font: 11px var(--f-mono); color: var(--text); }
  .edge-row .arrow { color: var(--faint); }
  .edge-row .lbl   { color: var(--accent); font-size: 10px; padding: 1px 6px; border-radius: 999px;
    border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent); }
  .edge-row button { padding: 3px 7px; font-size: 10px; }
  .edge-add { display: grid; grid-template-columns: 1fr auto; gap: 4px; }
  .edge-add select, .edge-add button { padding: 5px 8px; font: 11px var(--f-mono); margin: 0; }
  .n-card {
    position: absolute; width: 200px; min-height: 92px;
    background: var(--surface); border: 1px solid var(--edge-tint); border-radius: 10px;
    padding: 10px 12px; cursor: grab; user-select: none;
    display: flex; flex-direction: column; gap: 4px;
    transition: border-color .14s var(--ease), box-shadow .14s var(--ease);
  }
  .n-card:hover { border-color: var(--edge-hi); }
  .n-card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in oklab, var(--accent) 25%, transparent); }
  .n-card.connect-src { border-color: var(--design); }
  .n-card.dragging { cursor: grabbing; z-index: 10; }
  .n-card .n-head { display: flex; align-items: baseline; gap: 8px; }
  .n-card .n-kind { font: 10px var(--f-mono); color: var(--faint); letter-spacing: 0.08em; text-transform: uppercase; }
  .n-card .n-id   { margin-left: auto; font: 10px var(--f-mono); color: var(--faint); }
  .n-card .n-title { font: 500 13px var(--f-ui); color: var(--text); }
  .n-card .n-foot { margin-top: auto; display: flex; justify-content: space-between; font: 10px var(--f-mono); color: var(--faint); }

  .status { font: 11px var(--f-mono); color: var(--mute); margin-top: 10px; }
  .status.ok  { color: #90d6b0; }
  .status.err { color: var(--ship); }
  .problems { background: color-mix(in oklab, var(--ship) 10%, transparent);
    border: 1px solid color-mix(in oklab, var(--ship) 30%, transparent);
    border-radius: 6px; padding: 8px 10px; font: 11px var(--f-mono); color: var(--text); margin-top: 8px; }

  .ed-mode { display: flex; gap: 4px; margin-bottom: 10px; }
  .ed-mode button { flex: 1; padding: 6px 10px; font: 11px var(--f-mono);
    background: transparent; color: var(--mute); border: 1px solid var(--edge-tint);
    border-radius: 999px; cursor: pointer; }
  .ed-mode button.on { color: var(--accent); border-color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, transparent); }

  .ed-json { padding: 20px; height: 100%; display: none; flex-direction: column; }
  .ed-json textarea { flex: 1; width: 100%; padding: 14px; font: 12px/1.55 var(--f-mono);
    color: var(--text); background: var(--bg); border: 1px solid var(--edge-tint); border-radius: 10px; outline: none; resize: none; }
  body.json-mode .ed-canvas { display: none; }
  body.json-mode .ed-json { display: flex; }

  /* Workflow header row — sits below the main nav. Each field has a tiny
     uppercase mono label so what it represents is unambiguous; the inputs
     match the dark surface + hairline edge language of the rest of the app. */
  .wf-header {
    display: grid; grid-template-columns: 220px 1fr 140px auto; gap: 20px;
    align-items: end;
    padding: 14px 24px 16px; background: var(--surface);
    border-bottom: 1px solid var(--edge-tint);
  }
  .wf-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .wf-field label {
    font: 10px var(--f-mono); color: var(--faint); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .wf-field input, .wf-field select {
    font: 13px var(--f-ui); color: var(--text); background: var(--bg);
    border: 1px solid var(--edge-tint); border-radius: 6px; padding: 7px 10px; outline: none;
    width: 100%; min-width: 0;
  }
  .wf-field input:focus, .wf-field select:focus { border-color: var(--accent); }
  .wf-field.wf-id input    { font-family: var(--f-mono); color: var(--accent); font-size: 12px; }
  .wf-field.wf-title input { font-weight: 500; }
  .wf-actions { display: flex; align-items: center; gap: 6px; }

  /* Layout accounts for the extra header row. */
  .ed-layout { height: calc(100vh - 56px - 65px); }
  /* Sidebar hides itself when nothing is selected — the canvas fills. */
  .ed-layout.no-sel { grid-template-columns: 1fr 0; }
  .ed-layout.no-sel .ed-side { display: none; }

  /* Add Node lives in the header actions. The popover opens below the button. */
  .add-wrap { position: relative; display: inline-block; }
  .add-btn {
    font: 500 12px var(--f-ui); color: var(--accent-ink); background: var(--accent);
    border: none; border-radius: 999px; padding: 7px 14px; cursor: pointer;
    box-shadow: 0 2px 8px color-mix(in oklab, var(--accent) 24%, transparent);
    letter-spacing: -0.005em;
  }
  .add-btn:hover { filter: brightness(1.08); }
  .add-pop {
    display: none;
    position: absolute; top: calc(100% + 8px); right: 0;
    background: var(--surface); border: 1px solid var(--edge-tint); border-radius: 10px;
    padding: 14px; width: 280px; z-index: 50;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .add-pop.on { display: flex; flex-direction: column; gap: 2px; }
  .add-pop label { font: 10px var(--f-mono); color: var(--faint); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 6px; }
  .add-pop select { font: 12px var(--f-mono); color: var(--text); background: var(--bg); border: 1px solid var(--edge-tint); border-radius: 6px; padding: 6px 8px; outline: none; }
  .add-pop select:focus { border-color: var(--accent); }
  .add-pop .add-pop-cta { margin-top: 10px; }

  /* ----- Node cards: tint the top strip + icon by kind so types read at a
     glance. One accent per kind, drawn from the app's existing palette. ----- */
  .n-card[data-kind="agent"]    { --kind-color: #a3abff; }  /* periwinkle (claude) */
  .n-card[data-kind="script"]   { --kind-color: #efb36c; }  /* amber (terminal) */
  .n-card[data-kind="decision"] { --kind-color: #f2a93b; }  /* gold (human choice) */
  .n-card[data-kind="check"]    { --kind-color: #7cd4a4; }  /* mint (ok/fail) */
  .n-card[data-kind="publish"]  { --kind-color: #f26b7a; }  /* coral (ship) */
  .n-card[data-kind="display"]  { --kind-color: #9ab6c7; }  /* slate (passive) */
  .n-card[data-kind="inputs"]   { --kind-color: #8ad3e3; }  /* cyan (form) */
  .n-card[data-kind="loop"]     { --kind-color: #c084fc; }  /* violet (control) */
  .n-card[data-kind="delay"]    { --kind-color: #8a90a5; }  /* mute */
  .n-card[data-kind="approve"]  { --kind-color: #7cd4a4; }  /* mint */
  /* Legacy kinds fall through to muted defaults. */
  .n-card { --kind-color: var(--faint); }
  /* Full-height color bar on the left edge: a clear kind signal from across
     the canvas. Keep the card's own hairline on the other three sides. */
  .n-card { border-left: 3px solid var(--kind-color); padding-left: 10px; }
  .n-card:hover { border-left-color: var(--kind-color); border-left-width: 3px; }
  .n-card.sel  { border-left-width: 4px; padding-left: 9px; }
  .n-card .n-kind { color: var(--kind-color); opacity: 1; letter-spacing: 0.1em; }

  /* Floating toast for validation feedback. Appears at the bottom of the viewport. */
  .ed-toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    max-width: 560px; min-width: 320px; z-index: 25;
    padding: 10px 14px;
    background: var(--surface); border: 1px solid var(--edge-tint); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .ed-toast .status { margin: 0; }
  .ed-toast .problems { margin-top: 8px; }
</style>
</head><body>

<nav class="nav">
  <span class="app-menu" id="appMenu"></span>
  <span class="here">Workflow editor</span>
  <span class="spacer"></span>
  <a class="link" href="/workflows.html#workflows">← back to Workflows</a>
</nav>

<header class="wf-header">
  <div class="wf-field wf-id">
    <label for="wfId">Workflow id</label>
    <input id="wfId" spellcheck="false" placeholder="hyphenated-id">
  </div>
  <div class="wf-field wf-title">
    <label for="wfTitle">Title</label>
    <input id="wfTitle" placeholder="Human-readable title">
  </div>
  <div class="wf-field">
    <label for="wfScope">Save to</label>
    <select id="wfScope">
      <option value="project">this project</option>
      <option value="user">global library</option>
    </select>
  </div>
  <div class="wf-actions">
    <div class="add-wrap">
      <button class="add-btn" id="btnAddNodeOpen">+ Add node</button>
      <div class="add-pop" id="addPop">
        <label for="newKind">Kind</label>
        <select id="newKind">
          <optgroup label="v2">
            <option value="agent">agent — call Claude</option>
            <option value="script">script — shell / capture</option>
            <option value="decision">decision — human picks a branch</option>
            <option value="check">check — pass / fail gate</option>
            <option value="publish">publish — PR / file / Slack</option>
            <option value="display">display — show upstream data</option>
            <option value="inputs">inputs — collect fields</option>
            <option value="loop">loop — map over an array</option>
            <option value="delay">delay — wait</option>
            <option value="approve">approve — human click-through</option>
          </optgroup>
          <optgroup label="legacy">
            <option value="document">document</option>
            <option value="report">report</option>
            <option value="mockup">mockup</option>
            <option value="diff">diff</option>
            <option value="shots">shots</option>
            <option value="shots-set">shots-set</option>
            <option value="terminal">terminal</option>
            <option value="ask">ask</option>
            <option value="pr">pr</option>
          </optgroup>
        </select>
        <label for="newAfter">After (input from)</label>
        <select id="newAfter"><option value="">— none —</option></select>
        <label for="newBefore">Before (next, optional)</label>
        <select id="newBefore"><option value="">— none —</option></select>
        <button class="add-btn add-pop-cta" id="btnAddNode">+ Add to canvas</button>
      </div>
    </div>
    <button class="run-btn" id="btnValidate">✓ validate</button>
    <button class="run-btn" id="btnSave" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent);">◆ save</button>
    <button class="run-btn" id="btnRun" title="Save, then start a run of this workflow">▶ run</button>
  </div>
</header>
<script type="module">
  import { mountAppMenu } from '/app-menu.mjs';
  mountAppMenu(document.getElementById('appMenu'), { here: 'workflows' });
</script>

<div class="ed-layout no-sel" id="edLayout">
  <div class="ed-canvas" id="edCanvas">
    <div class="ed-canvas-inner" id="edInner">
      <svg class="svg-edges" id="edEdges"></svg>
    </div>
  </div>

  <div class="ed-json" id="edJson">
    <textarea id="jsonArea" spellcheck="false"></textarea>
  </div>

  <aside class="ed-side">
    <div class="ed-mode">
      <button id="modeVisual" class="on">◇ Visual</button>
      <button id="modeJson">{ } JSON</button>
    </div>

    <div class="block" id="selBlock">
      <h3>Selected node</h3>
      <label>id</label><input id="selId" spellcheck="false">
      <label>title</label><input id="selTitle">
      <label>kind</label>
      <select id="selKind">
        <optgroup label="v2">
          <option>agent</option><option>script</option><option>decision</option>
          <option>check</option><option>publish</option><option>display</option>
          <option>inputs</option><option>loop</option><option>delay</option>
          <option>approve</option>
        </optgroup>
        <optgroup label="legacy">
          <option>document</option><option>report</option><option>mockup</option>
          <option>diff</option><option>shots</option><option>shots-set</option>
          <option>terminal</option><option>ask</option><option>pr</option>
        </optgroup>
      </select>
      <label>cost</label><input id="selCost" type="number" min="0" step="1" value="1">
      <!-- Per-kind spec editor; populated by the editor script. -->
      <div id="selSpec" class="spec-form"></div>
      <!-- Flow editor: incoming (comes after) and outgoing (goes before). -->
      <div id="selEdges" class="edges-form"></div>
      <div class="btn-row" style="margin-top:6px;">
        <button class="run-btn" id="btnConnect" title="Click a target node after this to draw an edge">↝ connect to…</button>
        <button class="run-btn danger" id="btnDelete">✕ delete</button>
      </div>
    </div>
  </aside>
</div>
<!-- Validation feedback as a floating toast at the bottom of the canvas. -->
<div class="ed-toast" id="edToast" style="display:none;">
  <div id="status" class="status"></div>
  <div id="problems" class="problems" style="display:none;"></div>
</div>

<script type="module" src="/workflow-editor.mjs"></script>
</body></html>
